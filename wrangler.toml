name = "urbane"
main = "src/worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "urbanefca.in", custom_domain = true }]

# Only /videos/* goes through the Worker (Range support for iPhone video).
# Test first: curl -I -H "Range: bytes=0-1" <site>/videos/hero.mp4
# If that already returns 206 without the Worker, delete src/worker, `main` and `run_worker_first`.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/videos/*"]
